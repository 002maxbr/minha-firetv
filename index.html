<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minha Fire TV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;600&display=swap">
<style>
:root{--bg:#0B0F1A;--fg:#F2F4F8;--mut:#A9B1C3;--card:#141A2B;--acc:#FF9900;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
#stage{position:absolute;width:1920px;height:1080px;transform-origin:0 0;color:var(--fg);font:400 26px Inter,system-ui,sans-serif}
section{position:absolute;inset:0;padding:48px 96px;box-sizing:border-box;display:none;flex-direction:column;gap:40px}
section.on{display:flex}
h1,h2{margin:0;font-family:'Space Grotesk',system-ui,sans-serif;font-weight:500}
h2{font-size:32px}h1{font-size:64px;font-weight:700}
button{font:inherit;color:inherit;border:0;background:transparent;cursor:pointer;outline:0;transition:transform .12s;padding:0}
.f:focus{outline:4px solid #fff;box-shadow:0 0 0 8px var(--acc);transform:scale(1.04);position:relative;z-index:2}
.top{display:flex;justify-content:space-between;align-items:center}
.tabs{display:flex;gap:16px}
.tab{height:56px;padding:0 32px;border-radius:28px;color:var(--mut);font-size:24px}
.tab.cur{background:var(--acc);color:#0B0F1A;font-weight:600}
.clk{font:500 32px 'Space Grotesk',system-ui,sans-serif}
.hero{height:400px;border-radius:32px;padding:56px;box-sizing:border-box;background:linear-gradient(100deg,#1B2A5A,#3A1F5C 55%,#0B0F1A);display:flex;flex-direction:column;justify-content:flex-end;gap:16px}
.kick{font-size:22px;letter-spacing:2px;color:#FFC266}
.btns{display:flex;gap:20px;margin-top:8px}
.btn{height:64px;padding:0 48px;border-radius:12px;border:2px solid var(--mut);font-size:26px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#0B0F1A;font-weight:600}
.row{display:flex;gap:32px}
.tile{width:268px;height:150px;border-radius:20px;font-size:28px;font-weight:600;color:#fff}
.card{width:360px;display:flex;flex-direction:column;gap:12px;text-align:left;border-radius:16px}
.poster{width:260px}
.th{display:block;height:203px;border-radius:16px;position:relative;overflow:hidden}
.poster .th{height:300px}
.th i{position:absolute;left:0;bottom:0;height:8px;background:var(--acc)}
.srow{display:flex;gap:96px}
.field{height:80px;border-radius:16px;background:var(--card);display:flex;align-items:center;padding:0 32px;font-size:32px;margin-bottom:32px}
.keys{display:grid;grid-template-columns:repeat(7,96px);gap:16px}
.key{height:96px;border-radius:16px;background:#1A2033;font-size:32px;font-weight:600}
.key.w{grid-column:span 2;font-size:26px;font-weight:400}
.res{height:120px;border-radius:16px;background:var(--card);display:flex;align-items:center;gap:24px;padding:0 24px;font-size:28px;margin-bottom:16px;width:100%;text-align:left}
.res i{width:160px;height:90px;border-radius:10px;background:linear-gradient(135deg,#243B8F,#0B0F1A)}
.set{width:1200px;height:104px;border-radius:16px;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:0 32px;font-size:28px;margin-bottom:16px}
.set b{color:var(--mut);font-weight:400;font-size:26px}
.mut{color:var(--mut);font-size:24px}
#relogio{justify-content:flex-end;gap:8px;padding:96px;background:radial-gradient(circle at 70% 30%,#1B2A5A,#0B0F1A 70%)}
#bigclk{font:500 240px/1 'Space Grotesk',system-ui,sans-serif}
#dt{font-size:40px;color:#C8CEDD}
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* ===== EDITE AQUI: conteúdo da sua tela ===== */
const C={
 hero:['EM DESTAQUE PARA VOCÊ','[TÍTULO EM DESTAQUE]'],
 apps:[['Vídeo','#243B8F','#filmes'],['Música','#1F6E5C',''],['Jogos','#7A2E4A',''],['TV ao vivo','#6B4A12',''],['Fotos','#3B3F52',''],['Ajustes','#2A2F40','#ajustes']],
 cont:[['[Título 1]',70,'#243B8F'],['[Título 2]',35,'#1F6E5C'],['[Título 3]',85,'#7A2E4A'],['[Título 4]',15,'#6B4A12']],
 rec:[['[Título 5]','#3A1F5C'],['[Título 6]','#1B2A5A'],['[Título 7]','#1F6E5C'],['[Título 8]','#7A2E4A'],['[Título 9]','#6B4A12'],['[Título 10]','#3B3F52']]
};
/* ============================================ */
/* Ponte com o app Android: lista os apps instalados (fixados primeiro) */
const PIN=['com.netflix.ninja','com.amazon.firetv.youtube','com.disney.disneyplus','com.spotify.tv.android'];
try{if(window.Launcher){const P=['#243B8F','#1F6E5C','#7A2E4A','#6B4A12','#3B3F52'];
 const L=JSON.parse(Launcher.apps()).sort((a,b)=>{const x=PIN.indexOf(a.pkg),y=PIN.indexOf(b.pkg);return (x<0?99:x)-(y<0?99:y)||a.label.localeCompare(b.label)});
 C.apps=L.slice(0,5).map((a,i)=>[a.label,P[i],'pkg:'+a.pkg]);C.apps.push(['Ajustes','#2A2F40','#ajustes'])}}catch(e){}
const $=(s,r=document)=>r.querySelector(s);
const ACC=['#FF9900','#4DA3FF','#3DDC97','#FF6B8B'],ACCN=['Laranja','Azul','Verde','Rosa'];
const IDLE=[1,5,0],IDLEN=['Após 1 minuto','Após 5 minutos','Desativado'];
const S={acc:0,idle:0,h24:1,date:1};
try{Object.assign(S,JSON.parse(localStorage.getItem('ftv')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ftv',JSON.stringify(S))}catch(e){}};
const nav=i=>`<div class="top"><div class="tabs">${[['Início','#home'],['Buscar','#busca'],['Filmes e séries','#filmes'],['Ajustes','#ajustes']].map((t,j)=>`<button class="f tab${j===i?' cur':''}" data-go="${t[1]}">${t[0]}</button>`).join('')}</div><span class="clk"></span></div>`;
const card=c=>`<button class="f card"><span class="th" style="background:linear-gradient(135deg,${c[2]},#0B0F1A)"><i style="width:${c[1]}%"></i></span><span>${c[0]}</span></button>`;
const poster=c=>`<button class="f card poster"><span class="th" style="background:linear-gradient(160deg,${c[1]},#0B0F1A)"></span><span>${c[0]}</span></button>`;
const keys='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(k=>`<button class="f key" data-k="${k}">${k}</button>`).join('')+'<button class="f key w" data-k=" ">Espaço</button><button class="f key w" data-k="&lt;">Apagar</button>';
const setRow=(k,l)=>`<button class="f set" data-set="${k}"><span>${l}</span><b></b></button>`;
$('#stage').innerHTML=
`<section id="home">${nav(0)}<div class="hero"><div class="kick">${C.hero[0]}</div><h1>${C.hero[1]}</h1><div class="btns"><button class="f btn pri" data-first data-go="#filmes">Assistir agora</button><button class="f btn">Mais detalhes</button></div></div><h2>Seus apps</h2><div class="row">${C.apps.map(a=>`<button class="f tile" style="background:${a[1]}" data-go="${a[2]}">${a[0]}</button>`).join('')}</div></section>
<section id="filmes">${nav(2)}<h2>Continuar assistindo</h2><div class="row">${C.cont.map(card).join('')}</div><h2>Recomendados para você</h2><div class="row">${C.rec.map(poster).join('')}</div></section>
<section id="busca">${nav(1)}<div class="srow"><div><div class="field" id="q"></div><div class="keys">${keys}</div></div><div style="flex:1"><h2 id="rt" style="margin-bottom:20px"></h2><div id="res"></div></div></div></section>
<section id="ajustes">${nav(3)}<h1>Ajustes</h1><div>${setRow('acc','Cor de destaque')}${setRow('idle','Protetor de tela')}${setRow('h24','Formato da hora')}${setRow('date','Mostrar data no relógio')}</div><div class="mut">Use as setas e o botão central do controle. Voltar retorna ao início.</div></section>
<section id="relogio"><div id="bigclk"></div><div id="dt"></div></section>`;
/* escala 1920x1080 para qualquer TV */
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080),st=$('#stage');st.style.transform=`scale(${s})`;st.style.left=(innerWidth-1920*s)/2+'px';st.style.top=(innerHeight-1080*s)/2+'px'}
addEventListener('resize',fit);fit();
/* relógio */
function tick(){const d=new Date(),t=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',hour12:!S.h24});
 document.querySelectorAll('.clk').forEach(e=>e.textContent=t);$('#bigclk').textContent=t;
 const dt=$('#dt');dt.style.display=S.date?'block':'none';dt.textContent=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}
setInterval(tick,10000);
/* ajustes */
function paint(){document.documentElement.style.setProperty('--acc',ACC[S.acc]);
 const v={acc:ACCN[S.acc],idle:IDLEN[S.idle],h24:S.h24?'24 horas':'12 horas',date:S.date?'Sim':'Não'};
 document.querySelectorAll('[data-set]').forEach(b=>$('b',b).textContent=v[b.dataset.set]);tick()}
function cyc(b){const k=b.dataset.set,n={acc:ACC.length,idle:IDLE.length,h24:2,date:2}[k];S[k]=(S[k]+1)%n;save();paint()}
/* busca */
let q='';const CAT=[...C.cont.map(c=>c[0]),...C.rec.map(c=>c[0]),...C.apps.map(a=>a[0])];
function search(){$('#q').innerHTML=q?q:'<span class="mut" style="font-size:32px">Buscar filmes, séries e apps</span>';
 const r=q?CAT.filter(t=>t.toLowerCase().includes(q.toLowerCase())):CAT.slice(0,4);
 $('#rt').textContent=q?'Resultados':'Em alta';
 $('#res').innerHTML=r.length?r.slice(0,5).map(t=>`<button class="f res"><i></i><span>${t}</span></button>`).join(''):'<div class="mut">Nada encontrado.</div>'}
/* rotas por hash */
function show(){const id=(location.hash||'#home').slice(1),sc=document.getElementById(id)||$('#home');
 document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s===sc));
 const f=sc.querySelector('[data-first]')||sc.querySelector('.f');if(f)f.focus()}
addEventListener('hashchange',show);
$('#stage').addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g&&g.dataset.go){const go=g.dataset.go;if(go.startsWith('pkg:')){try{Launcher.open(go.slice(4))}catch(x){}}else location.hash=go;return}
 const k=e.target.closest('[data-k]');if(k){const c=k.dataset.k;q=c==='<'?q.slice(0,-1):q+c;search();return}
 const s=e.target.closest('[data-set]');if(s)cyc(s)});
/* navegação por setas (controle remoto) */
function move(d){const sc=$('section.on'),all=[...sc.querySelectorAll('.f')],c=document.activeElement;
 if(!all.includes(c)){if(all[0])all[0].focus();return}
 const r=c.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let best=null,bs=1e9;
 for(const e of all){if(e===c)continue;const p=e.getBoundingClientRect(),x=p.left+p.width/2-cx,y=p.top+p.height/2-cy;
  const a=d==='R'?x:d==='L'?-x:d==='D'?y:-y,o=(d==='R'||d==='L')?Math.abs(y):Math.abs(x);
  if(a<=4)continue;const s=a+o*2.5;if(s<bs){bs=s;best=e}}
 if(best)best.focus()}
let last=Date.now();
addEventListener('keydown',e=>{last=Date.now();
 if($('section.on').id==='relogio'){e.preventDefault();location.hash='#home';return}
 const m={ArrowRight:'R',ArrowLeft:'L',ArrowDown:'D',ArrowUp:'U'};
 if(m[e.key]){e.preventDefault();move(m[e.key])}
 else if(['Escape','Backspace','GoBack'].includes(e.key)&&location.hash&&location.hash!=='#home'){e.preventDefault();location.hash='#home'}});
addEventListener('mousemove',()=>{last=Date.now()});
setInterval(()=>{const m=IDLE[S.idle];if(m&&Date.now()-last>m*60000&&$('section.on').id!=='relogio')location.hash='#relogio'},5000);
paint();search();show();
</script>
</body>
</html>
